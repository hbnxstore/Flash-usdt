<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HBNX Store</title>
<style>
body{font-family:Arial,sans-serif;background:#111;color:#fff;margin:0}
header{background:#16a34a;padding:20px;text-align:center}
.container{max-width:800px;margin:auto;padding:20px}
.card{background:#1f1f1f;border-radius:12px;padding:20px;margin:20px 0}
input,textarea{
width:100%;
padding:12px;
margin-top:10px;
border-radius:8px;
border:none;
box-sizing:border-box;
}
button{
background:#16a34a;
color:#fff;
padding:12px 20px;
border:none;
border-radius:8px;
cursor:pointer;
margin-top:15px;
}
button:hover{opacity:.9}
.copy{
background:#2563eb;
margin-top:10px;
}
</style>
</head>
<body>

<header>
<h1>HBNX STORE</h1>
<p>متجر المنتجات الرقمية</p>
</header>

<div class="container">

<div class="card">
<h2>المنتج</h2>
<p>اسم المنتج: <b>flashusdt</b></p>
<p>السعر: <b>30$</b></p>
</div>

<div class="card">
<h2>💳 طرق الدفع</h2>

<p><b>Binance Pay ID</b></p>
<input id="binance" value="1251933020" readonly>
<button class="copy" onclick="copy('binance')">نسخ Binance ID</button>

<p><b>USDT (TRC20)</b></p>
<input id="wallet" value="TEUToBWeL5HEDHNNm9YQJKWYZxzNgWE3by" readonly>
<button class="copy" onclick="copy('wallet')">نسخ عنوان المحفظة</button>
</div>

<div class="card">
<h2>إرسال بيانات الطلب</h2>

<input placeholder="الاسم">

<input placeholder="@Telegram">

<input placeholder="TXID">

<textarea placeholder="ملاحظات"></textarea>

<button>إرسال</button>

<p>بعد الدفع يرجى التواصل عبر تيليجرام:
<b>@iacel11</b></p>

</div>

</div>

<script>
function copy(id){
const x=document.getElementById(id);
navigator.clipboard.writeText(x.value);
alert("تم النسخ");
}
</script>

</body>
</html>
